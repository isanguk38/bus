<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>버스 지금 어디</title>
  <meta name="description" content="탈 버스가 지금 어디쯤 오는지, 내 정류장까지 몇 분 남았는지 지도 위에서 실시간으로 보여줍니다.">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="map" role="application" aria-label="버스 지도"></div>

  <aside class="panel" id="panel" aria-label="버스 찾기">
    <header class="panel-head">
      <button type="button" class="back-btn" id="back" hidden aria-label="노선 검색으로 돌아가기">←</button>
      <h1 id="panel-title"><span aria-hidden="true">🚌</span> 버스 지금 어디</h1>
      <button type="button" class="icon-btn" id="collapse" aria-expanded="true" aria-controls="panel-body">접기</button>
    </header>

    <div class="panel-body" id="panel-body">
      <!-- 1단계: 노선 검색 -->
      <section class="view" id="view-search">
        <form class="search" id="search-form" role="search">
          <label class="field">
            <span>지역 <button type="button" class="link-btn inline" id="detect-region">📍 내 위치로 선택</button></span>
            <select id="region" required>
              <option value="seoul">서울특별시</option>
            </select>
          </label>
          <label class="field grow">
            <span>노선 번호</span>
            <input id="query" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="예: 7016, 10번" maxlength="20" required>
          </label>
          <button type="submit" class="btn">검색</button>
        </form>
        <p class="message" id="search-message" role="status">타실 버스 번호를 검색하세요. 지도에서 버스가 오는 모습과 내 정류장까지 남은 시간을 보여드려요.</p>
        <ul class="list" id="results"></ul>
      </section>

      <!-- 2단계: 노선 실시간 지도 -->
      <section class="view" id="view-route" hidden>
        <div class="route-title">
          <span class="route-badge" id="route-number"></span>
          <span class="chip" id="route-type"></span>
          <span class="live-dot" id="live-dot" title="실시간 연결 상태"></span>
        </div>
        <p class="route-ends" id="route-ends"></p>
        <div class="legend" id="route-legend" hidden aria-label="노선 방향별 선 색"></div>

        <div class="mystop" id="mystop" hidden>
          <div class="mystop-head">
            <span class="muted">내 정류장</span>
            <strong id="mystop-name"></strong>
            <span class="muted" id="mystop-direction"></span>
          </div>
          <ul class="list approach" id="approach-list" aria-live="polite"></ul>
          <label class="toggle">
            <input type="checkbox" id="show-all-buses">
            <span>반대 방향·지나간 버스도 지도에 보기</span>
          </label>
          <button type="button" class="link-btn" id="change-stop">탈 곳 바꾸기</button>
        </div>

        <!-- 탈 곳 정하기 -->
        <div class="board" id="board">
          <h2 class="board-title">어디서 타세요?</h2>
          <button type="button" class="btn" id="board-nearby">📍 내 주변 정류장 보기</button>
          <form class="place-search" id="board-form" role="search">
            <div class="place-row">
              <input id="board-query" type="search" enterkeyhint="search" autocomplete="off" minlength="2" maxlength="40" required
                placeholder="정류장 이름으로 찾기" aria-label="탑승할 정류장 또는 장소">
              <button type="submit" class="btn small ghost">찾기</button>
            </div>
          </form>
          <p class="hint">지도에서 정류장을 눌러 "여기서 탈래요"를 골라도 돼요.</p>
          <p class="message" id="board-message" role="status"></p>
          <ul class="list" id="board-results"></ul>
        </div>

        <dl class="stats">
          <div><dt>운행 중</dt><dd id="bus-count">-</dd></div>
          <div><dt>위치 수신</dt><dd id="last-update">-</dd></div>
        </dl>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
        <p class="message" id="live-message" role="status"></p>
        <p class="note" id="path-note" hidden></p>
        <label class="toggle">
          <input type="checkbox" id="show-raw">
          <span>원본 GPS 위치 함께 보기</span>
        </label>
      </section>
    </div>
  </aside>
</body>
</html>
